<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Incidencias - Pixel Norte</title>
<style>
    body{font-family:Arial,Helvetica,sans-serif;padding:24px}
    h2{color:#222;font-size:18px}
    table{border-collapse:collapse;width:640px;font-size:13px}
    th,td{border:1px solid #9aa5b1;padding:8px 10px;text-align:center}
    thead th{background:#1f3a5f;color:#fff}
    .turno{background:#e8eef7;color:#1f3a5f;font-weight:bold}
    .libre{background:#fdecea;color:#b71c1c}
    .sop{background:#e6f4ea;color:#1e7a3c;font-weight:bold}
    tfoot td{background:#f2f4f7;font-weight:bold;color:#37474f}
</style>
</head>
<body>
    <h2>Tabla de incidencias de la empresa</h2>
    <table>
     <thead>
            <tr><th rowspan="2">Día</th><th colspan="2">Turno de mañana</th><th colspan="2">Turno de tarde</th></tr>
         <tr><th>Técnico</th><th>Incidencias</th><th>Técnico</th><th>Incidencias</th></tr>
        </thead>
        <tbody>
            <tr><td class="turno">Lunes</td><td>Ana</td><td class="sop">3</td><td rowspan="2">Luis</td><td class="sop">2</td></tr>
            <tr><td class="turno">Martes</td><td>Ana</td><td class="sop">5</td><td class="libre">0</td></tr>
            <tr><td class="turno">Miércoles</td><td colspan="2">Mantenimiento programado</td><td>Pedro</td><td class="sop">4</td></tr>
            <tr><td class="turno">Jueves</td><td>Luis</td><td class="sop">1</td><td>Pedro</td><td class="sop">6</td></tr>
        </tbody>
         <tfoot><tr><td colspan="5">Total semanal: 21 incidencias</td></tr></tfoot>
    </table>
</body>
</html>
